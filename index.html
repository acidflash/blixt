<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blixt</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blixt">
  <meta name="theme-color" content="#0d0d1a">
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <div id="map-controls">
    <div class="layer-select-wrap">
      <button id="layer-toggle" class="map-ctrl-btn">🗺 <span class="btn-label">Karta</span></button>
      <div id="layer-menu" class="layer-menu hidden">
        <button class="layer-option" data-layer="dark">Mörk</button>
        <button class="layer-option" data-layer="light">Ljus</button>
        <button class="layer-option" data-layer="satellite">Satellit</button>
        <button class="layer-option" data-layer="osm">Standard</button>
      </div>
    </div>
    <button id="wind-toggle" class="map-ctrl-btn">💨 <span class="btn-label">Vind</span></button>
    <button id="radar-toggle" class="map-ctrl-btn">🌧 <span class="btn-label">Radar</span></button>
    <button id="fires-toggle" class="map-ctrl-btn">🔥 <span class="btn-label">Bränder</span></button>
  </div>
  <div id="legend">
    <div class="legend-title">Blixtar · ålder</div>
    <div class="legend-body">
      <div class="legend-col">
        <div class="legend-bar-label" title="Blitzortung (realtid)">⚡</div>
        <div class="legend-bar" id="legend-bar-blitz"></div>
      </div>
      <div class="legend-col">
        <div class="legend-bar-label" title="SMHI (historiskt)">SMHI</div>
        <div class="legend-bar" id="legend-bar-smhi"></div>
      </div>
      <div id="legend-labels">
        <span>Nu</span>
        <span>1 tim</span>
        <span>2 tim</span>
        <span>3 tim</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
